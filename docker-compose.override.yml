# Ambiente LOCAL (se carga automáticamente)
services:
  postgres:
    ports:
      - "5432:5432"
  redis:
    ports:
      - "6379:6379"
  backend:
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - ./backend/app:/app/app:z
    ports:
      - "8000:8000"
  frontend:
    build:
      target: dev
    volumes:
      - ./frontend:/app:z
      - /app/node_modules
  nginx:
    environment:
      FRONTEND_UPSTREAM: frontend:5173
      # Vite dev: script en línea de React Refresh y WebSocket de recarga (HMR).
      NGINX_CSP: "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' ws: wss:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"

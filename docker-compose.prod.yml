# Ambiente PRODUCCIÓN/DEMO
services:
  postgres:
    restart: always
  redis:
    restart: always
  backend:
    restart: always
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "2"]
  frontend:
    restart: always
  nginx:
    restart: always
    environment:
      # Detrás de HTTPS en la VM de NODOVIP (PC-47).
      NGINX_HSTS: "max-age=31536000; includeSubDomains"

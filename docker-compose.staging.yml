# Ambiente TESTING/STAGING
services:
  postgres:
    restart: unless-stopped
  redis:
    restart: unless-stopped
  backend:
    restart: unless-stopped
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--log-level", "debug"]
  frontend:
    restart: unless-stopped
  nginx:
    restart: unless-stopped
    environment:
      # Detrás de HTTPS en la VM de NODOVIP (PC-47).
      NGINX_HSTS: "max-age=31536000; includeSubDomains"

name: nodovip

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      APP_ENV: ${APP_ENV}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      JWT_SECRETO: ${JWT_SECRETO:-}
      COOKIE_SEGURA: ${COOKIE_SEGURA:-}
      # Invitaciones por correo (PB-06). Sin BREVO_API_KEY se escriben en el log.
      APP_URL: ${APP_URL:-}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      CORREO_REMITENTE: ${CORREO_REMITENTE:-}
      CORREO_REMITENTE_NOMBRE: ${CORREO_REMITENTE_NOMBRE:-}
      # Máximo de sesiones en curso a la vez (PC-24). Vacío = 10.
      MAX_SESIONES_ACTIVAS: ${MAX_SESIONES_ACTIVAS:-}
      # El backend solo es alcanzable a través de NGINX (salvo el 8000 en local),
      # así que se confía en su X-Forwarded-For para obtener la IP del cliente.
      FORWARDED_ALLOW_IPS: "*"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      target: prod

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${HTTP_PORT:-8080}:80"
    environment:
      FRONTEND_UPSTREAM: frontend:80
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro,z
    depends_on:
      - frontend
      - backend

volumes:
  pgdata:
